name: CI

# Builds all the operators in Release on Windows and macOS and uploads one package per system.
#   Windows: base-layer tests, mock-host tests, package checks and parity tests against PyEyesWeb.
#   macOS:   base-layer tests and a check of every bundle (both architectures, the three TouchDesigner entry points); the
#            mock host loads DLLs and runs on Windows only.
# A tag v<VERSION> also creates a GitHub pre-release with both packages.
# The workspace has the layout of the lab machines:
#   work/EyesWebTD   this repository
#   work/EyesWebCore the C++ core (on Windows it also builds the Python module that PyEyesWeb needs)
#   work/PyEyesWeb   the Python package (parity tests)
# EyesWebCore is private: it and PyEyesWeb are checked out with the secret CHECKOUT_TOKEN (a token that can read them), at
# the branch in CORE_REF / PYEYESWEB_REF.

on:
  push:
    branches: [main, dev]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

env:
  CORE_REF: dev
  PYEYESWEB_REF: dev

permissions:
  contents: write   # the release job creates the release of a tag

jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          path: work/EyesWebTD
      - uses: actions/checkout@v4
        with:
          repository: InfoMusCP/EyesWebCore
          ref: ${{ env.CORE_REF }}
          token: ${{ secrets.CHECKOUT_TOKEN }}
          path: work/EyesWebCore
      - uses: actions/checkout@v4
        with:
          repository: InfoMusCP/PyEyesWeb
          ref: ${{ env.PYEYESWEB_REF }}
          token: ${{ secrets.CHECKOUT_TOKEN }}
          path: work/PyEyesWeb
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"   # the Python that TouchDesigner 2025.x bundles: the core module is built for it
      - name: Python tools
        run: python -m pip install numpy pytest nanobind scipy

      - name: Check that the tag matches VERSION
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          [ "v$(cat work/EyesWebTD/VERSION)" = "${GITHUB_REF_NAME}" ] || { echo "tag ${GITHUB_REF_NAME} != VERSION $(cat work/EyesWebTD/VERSION)"; exit 1; }

      - name: Build the core Python module (for the parity tests)
        shell: bash
        run: |
          cd work/EyesWebCore
          cmake -S . -B build -G "Visual Studio 17 2022" -A x64 -DEW_BUILD_PYTHON=ON "-Dnanobind_DIR=$(python -m nanobind --cmake_dir)"
          cmake --build build --config Release --parallel

      - name: Build the operators
        shell: bash
        run: |
          cd work
          cmake -S EyesWebTD -B build -G "Visual Studio 17 2022" -A x64
          cmake --build build --config Release --parallel

      - name: Base-layer tests
        run: work\build\Release\ew_td_tests.exe

      - name: Host, package and parity tests
        shell: bash
        env:
          EW_TD_PLUGINS: ${{ github.workspace }}/work/build/Plugins/EyesWeb
        run: python -m pytest work/EyesWebTD/tests -q

      - name: Package
        shell: bash
        run: |
          cd work/build
          cpack -C Release
      - uses: actions/upload-artifact@v4
        with:
          name: EyesWebTD-win64
          path: work/build/EyesWebTD-*-win64.zip

  macos:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          path: work/EyesWebTD
      - uses: actions/checkout@v4
        with:
          repository: InfoMusCP/EyesWebCore
          ref: ${{ env.CORE_REF }}
          token: ${{ secrets.CHECKOUT_TOKEN }}
          path: work/EyesWebCore

      - name: Build the operators (universal arm64 + x86_64)
        run: |
          cd work
          cmake -S EyesWebTD -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --config Release --parallel

      - name: Base-layer tests
        run: ./work/build/ew_td_tests

      - name: Check the bundles
        run: |
          cd work/build/Plugins/EyesWeb
          n=0
          for b in */*.plugin; do
            exe="$b/Contents/MacOS/$(basename "$b" .plugin)"
            archs="$(lipo -archs "$exe")"
            case "$archs" in *arm64*x86_64*|*x86_64*arm64*) ;; *) echo "$b: architectures '$archs'"; exit 1 ;; esac
            for sym in FillCHOPPluginInfo CreateCHOPInstance DestroyCHOPInstance; do
              nm -gU -arch arm64 "$exe" | grep -q " _$sym\$" || { echo "$b: $sym not exported"; exit 1; }
            done
            n=$((n+1))
          done
          echo "$n bundles checked"
          [ "$n" -eq "$(ls ../../../EyesWebTD/chops/*/*.cpp | grep -v _held_back | wc -l | tr -d ' ')" ]

      - name: Package
        run: |
          cd work/build
          cpack -C Release
      - uses: actions/upload-artifact@v4
        with:
          name: EyesWebTD-macos
          path: work/build/EyesWebTD-*-macos-universal.zip

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Create the pre-release with both packages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/*.zip --repo "${GITHUB_REPOSITORY}" --target "${GITHUB_SHA}" \
            --title "EyesWebTD ${GITHUB_REF_NAME} (alpha)" --prerelease --notes-file CHANGELOG.md
